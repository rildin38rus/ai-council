name: Gemini PR review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Number of the PR to review'
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: gemini-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  gemini-review:
    # Only owner-authored same-repository PRs. Fork PRs get no API secrets.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == github.repository_owner) ||
      (github.event_name == 'workflow_dispatch' &&
       github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Checkout only trusted BASE code. Never checkout or run PR head code with secrets.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Gemini reviews diff as untrusted text
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          GEMINI_REVIEW_MODEL: ${{ vars.GEMINI_REVIEW_MODEL || 'gemini-3.5-flash-lite' }}
          GEMINI_REVIEW_THINKING_LEVEL: ${{ vars.GEMINI_REVIEW_THINKING_LEVEL || 'medium' }}
        run: python scripts/gemini_pr_review.py
